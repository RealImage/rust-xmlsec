[package]
name = "xmlsec"
version = "1.1.0"
authors = [
    "Leonhard Weber <leonhard.weber@voipir.cl>",
    "Stefan Sommerfeld <stefan.sommerfeld@gmail.com>",
]
edition = "2024"
readme = "README.md"
license = "MIT"
description = "Wrapper for xmlsec1 library"
homepage = "https://github.com/zerocom38/rust-xmlsec"
repository = "https://github.com/zerocom38/rust-xmlsec"
keywords = ["xml", "xmlsec", "dsig"]

[features]
vendored = ["dep:xmlsec1-src"]

[dependencies]
libxml = "0.3.22"
openssl-sys = "0.9.117"
openssl = "0.10.81"
bitflags = "2.13.2"
log = "0.4.34"
once_cell = "1.21.4"

[dev-dependencies]
env_logger = "0.11.11"

[build-dependencies]
bindgen = "0.73.2"
xmlsec1-src = { git = "https://github.com/zerocom38/rust-xmlsec1-src.git", optional = true }

# Windows builds the vendored xmlsec by default, see build.rs.
[target.'cfg(windows)'.build-dependencies]
vcpkg = "0.2.15"
xmlsec1-src = { git = "https://github.com/zerocom38/rust-xmlsec1-src.git" }

[target.'cfg(not(windows))'.build-dependencies]
pkg-config = "0.3.34"
